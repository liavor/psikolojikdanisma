<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serenity | Psikolojik Danışmanlık Platformu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap');

        :root {
            --bg-color: #f8faf9; /* Çok açık adaçayı yeşili/krem */
            --primary-soft: #e2e8f0;
            --accent-green: #648270; /* Adaçayı yeşili */
            --accent-hover: #4f6959;
            --text-main: #2d3748;
            --text-muted: #718096;
            --panel-bg: rgba(255, 255, 255, 0.85);
        }

        html, body {
            background: linear-gradient(135deg, #f0f4f2 0%, #e2e8e4 100%);
            height: 100%;
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
        }

        .serif-font { font-family: 'Lora', serif; }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: white;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(100, 130, 112, 0.2);
        }

        .control-btn {
            background-color: white;
            color: var(--text-main);
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background-color: #f8faf9;
            border-color: #cbd5e1;
        }

        .control-btn.active-off {
            background-color: #fee2e2; /* Soft red */
            color: #ef4444;
            border-color: #fecaca;
        }

        .control-btn.active-blue {
            background-color: #e0f2fe; /* Soft blue for noise suppression */
            color: #0284c7;
            border-color: #bae6fd;
        }

        .spinner {
            border: 3px solid rgba(100, 130, 112, 0.2);
            border-top: 3px solid var(--accent-green);
            border-radius: 50%;
            width: 20px; height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Kameralar için tasarım */
        video {
            transform: scaleX(-1); /* Ayna efekti */
            object-fit: cover;
            width: 100%;
            height: 100%;
            background-color: #1a202c; /* Kamera kapalıyken koyu arka plan */
        }

        /* Video kapsayıcısı */
        .video-container {
            position: relative;
            border-radius: 1rem;
            overflow: hidden;
            background: #2d3748;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            aspect-ratio: 16 / 9;
        }

        .cam-off-overlay {
            position: absolute;
            inset: 0;
            background: #cbd5e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .user-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Yumuşak Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Katılımcı Noktası */
        .status-dot {
            width: 8px; height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 md:p-6 lg:p-8 relative">

    <!-- Giriş Ekranı -->
    <div id="login-screen" class="w-full max-w-lg relative z-10 transition-all duration-500">
        <div class="glass-panel p-10 rounded-3xl relative overflow-hidden text-center">
            <div class="mb-8">
                <i class="fa-solid fa-leaf text-4xl text-[#648270] mb-4"></i>
                <h1 class="serif-font text-3xl mb-2 text-slate-800">Serenity</h1>
                <p class="text-slate-500 text-sm">Uzman Psikolojik Danışman Ali Varol</p>
            </div>
            
            <div class="space-y-5 mb-8 text-left">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1 ml-1">Adınız Soyadınız</label>
                    <input type="text" id="nick-input" placeholder="Örn: Dr. Ayşe Yılmaz veya Can B." 
                        class="w-full bg-white/50 border border-slate-200 rounded-xl px-4 py-3.5 focus:outline-none focus:border-[#648270] focus:ring-2 focus:ring-[#648270]/20 transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1 ml-1">Görüşme Kodu (Oda)</label>
                    <input type="text" id="room-input" placeholder="Size iletilen gizli kodu girin" 
                        class="w-full bg-white/50 border border-slate-200 rounded-xl px-4 py-3.5 focus:outline-none focus:border-[#648270] focus:ring-2 focus:ring-[#648270]/20 transition-all">
                </div>
            </div>

            <button id="join-btn" class="btn-primary w-full py-4 rounded-xl text-md font-medium flex items-center justify-center gap-3">
                <span id="btn-text">Görüşmeye Katıl</span>
                <div id="btn-loader" class="spinner hidden"></div>
            </button>
            <p class="text-xs text-slate-400 mt-6"><i class="fa-solid fa-lock mr-1"></i> Görüşmeleriniz uçtan uca şifrelenmektedir.</p>
        </div>
    </div>

    <!-- Ana Terapi Ekranı -->
    <div id="chat-screen" class="hidden w-full max-w-7xl h-[90vh] flex flex-col glass-panel rounded-3xl overflow-hidden relative z-10 shadow-2xl">
        
        <!-- Üst Bilgi Çubuğu (Header) -->
        <div class="p-4 px-6 border-b border-slate-200 bg-white/40 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-[#648270]/10 flex items-center justify-center text-[#648270]">
                    <i class="fa-solid fa-leaf"></i>
                </div>
                <div>
                    <h2 class="serif-font text-lg text-slate-800 font-medium" id="display-room">Seans Odası</h2>
                    <p class="text-xs text-slate-500" id="display-nick">Bağlanıyor...</p>
                </div>
            </div>
            
            <!-- Sayaçlar ve Saat -->
            <div class="flex items-center gap-6 text-sm font-medium text-slate-600">
                <div class="flex items-center gap-2 bg-white/60 px-4 py-2 rounded-full border border-slate-100 shadow-sm">
                    <i class="fa-regular fa-clock text-[#648270]"></i>
                    <span id="current-time">00:00</span>
                </div>
                <div class="flex items-center gap-2 bg-white/60 px-4 py-2 rounded-full border border-slate-100 shadow-sm">
                    <i class="fa-solid fa-hourglass-half text-[#648270]"></i>
                    <span id="session-timer">00:00:00</span>
                </div>
            </div>
        </div>

        <!-- Ana İçerik Alanı -->
        <div class="flex-1 flex overflow-hidden">
            
            <!-- Sol Video ve Kontrol Alanı -->
            <div class="flex-1 flex flex-col relative bg-slate-50/50">
                
                <!-- Video Grid -->
                <div id="video-grid" class="flex-1 p-6 overflow-y-auto grid grid-cols-1 md:grid-cols-2 gap-6 content-center justify-items-center">
                    <!-- Videolar buraya eklenecek. -->
                    
                    <!-- Boş Durum (Bekleniyor) -->
                    <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center opacity-70 pointer-events-none z-0">
                        <i class="fa-solid fa-mug-hot text-5xl mb-4 text-[#648270]/40"></i>
                        <p class="serif-font text-lg text-slate-500">Danışanın / Danışmanın katılması bekleniyor...</p>
                    </div>
                </div>

                <!-- Alt Kontrol Çubuğu -->
                <div class="p-4 bg-white/80 border-t border-slate-200 flex justify-center items-center gap-4 relative z-20">
                    
                    <button id="cam-btn" title="Kamerayı Aç/Kapat" class="control-btn w-12 h-12 rounded-full flex items-center justify-center text-lg shadow-sm">
                        <i id="cam-icon" class="fa-solid fa-video"></i>
                    </button>
                    
                    <button id="mute-btn" title="Mikrofonu Aç/Kapat" class="control-btn w-12 h-12 rounded-full flex items-center justify-center text-lg shadow-sm">
                        <i id="mute-icon" class="fa-solid fa-microphone"></i>
                    </button>

                    <div class="w-px h-8 bg-slate-200 mx-2"></div> <!-- Ayırıcı -->

                    <button id="noise-btn" title="Dipses (Gürültü) Engelleme" class="control-btn active-blue w-12 h-12 rounded-full flex items-center justify-center text-lg shadow-sm">
                        <i id="noise-icon" class="fa-solid fa-wave-square"></i>
                    </button>

                    <button id="share-btn" title="Görüşme Linkini Kopyala" class="control-btn w-12 h-12 rounded-full flex items-center justify-center text-lg shadow-sm">
                        <i id="share-icon" class="fa-solid fa-link"></i>
                    </button>

                    <div class="w-px h-8 bg-slate-200 mx-2"></div> <!-- Ayırıcı -->

                    <button onclick="location.reload()" title="Görüşmeyi Sonlandır" class="bg-red-500 hover:bg-red-600 text-white w-12 h-12 rounded-full flex items-center justify-center text-lg shadow-sm transition-colors">
                        <i class="fa-solid fa-phone-slash"></i>
                    </button>
                </div>
            </div>

            <!-- Sağ Sohbet ve Liste Alanı -->
            <div class="w-80 bg-white/70 border-l border-slate-200 flex flex-col hidden md:flex">
                <!-- Katılımcılar -->
                <div class="p-4 border-b border-slate-100">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Katılımcılar</h3>
                    <ul id="user-list" class="space-y-2">
                        <!-- Katılımcı Listesi Dinamik -->
                    </ul>
                </div>

                <!-- Yazılı Sohbet Mesajları -->
                <div id="chat-messages" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3 text-sm">
                    <div class="text-center text-xs text-slate-400 bg-slate-100/50 py-2 rounded-lg mb-2 border border-slate-100">
                        <i class="fa-solid fa-shield-halved mr-1"></i> Mesajlar bu oturumla sınırlıdır ve kaydedilmez.
                    </div>
                </div>

                <!-- Sohbet Girdi Alanı -->
                <div class="p-3 bg-white border-t border-slate-200">
                    <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl overflow-hidden px-2 focus-within:border-[#648270] focus-within:ring-1 focus-within:ring-[#648270]/30 transition-all">
                        <input type="text" id="chat-input" placeholder="Not veya mesaj gönder..." 
                            class="flex-1 bg-transparent border-none py-2.5 px-2 focus:outline-none text-slate-700 text-sm">
                        <button id="chat-send-btn" class="text-[#648270] hover:text-[#4f6959] p-2 transition-colors">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PeerJS WebRTC -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script>
        // --- URL Parametreleri (Link ile katılım) ---
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomFromUrl = urlParams.get('room');
            if (roomFromUrl) {
                document.getElementById('room-input').value = roomFromUrl;
                document.getElementById('nick-input').focus();
            }
        });

        // Global Değişkenler
        let myPeer, myStream, myNick, roomName;
        let isHost = false;
        let peers = {}; 
        let hostDataConnections = []; 
        let myHostDataConnection = null; 
        let roomClients = []; 
        
        // Kontrol Durumları
        let isMuted = false;
        let isCamOff = false;
        let isNoiseSuppression = true; // Başlangıçta aktif

        // Zamanlayıcılar
        let sessionStartTime = null;
        let sessionTimerInterval = null;

        // UI Elementleri
        const loginScreen = document.getElementById('login-screen');
        const chatScreen = document.getElementById('chat-screen');
        const joinBtn = document.getElementById('join-btn');
        const userListUI = document.getElementById('user-list');
        const videoGridUI = document.getElementById('video-grid');
        const emptyState = document.getElementById('empty-state');
        
        // Butonlar
        const muteBtn = document.getElementById('mute-btn');
        const camBtn = document.getElementById('cam-btn');
        const noiseBtn = document.getElementById('noise-btn');
        const shareBtn = document.getElementById('share-btn');
        
        // Sohbet
        const chatInput = document.getElementById('chat-input');
        const chatSendBtn = document.getElementById('chat-send-btn');
        const chatMessages = document.getElementById('chat-messages');

        // --- GİRİŞ İŞLEMİ ---
        joinBtn.onclick = async () => {
            myNick = document.getElementById('nick-input').value.trim();
            const roomInput = document.getElementById('room-input').value.trim();

            if (!myNick || !roomInput) return alert("Lütfen Adınızı ve Görüşme Kodunu giriniz.");
            
            document.getElementById('btn-text').classList.add('hidden');
            document.getElementById('btn-loader').classList.remove('hidden');

            roomName = 'serenity-therapy-' + roomInput.toLowerCase().replace(/\s+/g, '-');

            try {
                // Kamera ve Mikrofon İzni İste (Gürültü engelleme parametresi ile)
                myStream = await navigator.mediaDevices.getUserMedia({ 
                    video: true, 
                    audio: {
                        noiseSuppression: isNoiseSuppression,
                        echoCancellation: true,
                        autoGainControl: true
                    } 
                });
                
                initPeerAsHost();
            } catch (err) {
                alert("Kamera veya Mikrofona erişilemedi. Lütfen tarayıcı izinlerini kontrol ediniz.");
                resetBtn();
            }
        };

        function resetBtn() {
            document.getElementById('btn-text').classList.remove('hidden');
            document.getElementById('btn-loader').classList.add('hidden');
        }

        // --- PEERJS BAĞLANTILARI ---
        function initPeerAsHost() {
            myPeer = new Peer(roomName);

            myPeer.on('open', (id) => {
                isHost = true;
                setupUI();
                listenForClients(); 
            });

            myPeer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    // İsim kullanımdaysa (Host içerideyse), client olarak gir
                    myPeer.destroy();
                    initPeerAsClient();
                } else {
                    alert("Bağlantı Hatası: Lütfen internetinizi kontrol edin.");
                    resetBtn();
                }
            });
        }

        function initPeerAsClient() {
            myPeer = new Peer(); 

            myPeer.on('open', (id) => {
                isHost = false;
                setupUI();

                myHostDataConnection = myPeer.connect(roomName);
                
                myHostDataConnection.on('open', () => {
                    myHostDataConnection.send({ type: 'join', id: id, nick: myNick });
                });

                myHostDataConnection.on('data', (data) => {
                    if (data.type === 'peer-list') {
                        data.peers.forEach(p => makeCall(p.id, p.nick));
                    }
                    if (data.type === 'chat') {
                        appendChatMessage(data.sender, data.text);
                    }
                    if (data.type === 'cam-state') {
                        handleRemoteCamState(data.peerId, data.isCamOff);
                    }
                });

                makeCall(roomName, "Danışman/Kurucu");
                listenForCalls();
            });
        }

        function listenForClients() {
            listenForCalls();

            myPeer.on('connection', (conn) => {
                hostDataConnections.push(conn); 

                conn.on('data', (data) => {
                    if (data.type === 'join') {
                        conn.send({ type: 'peer-list', peers: roomClients });
                        roomClients.push({ id: data.id, nick: data.nick });
                        systemMessage(`${data.nick} görüşmeye katıldı.`);
                        startSessionTimer(); // Biri katılınca sayacı başlat (Sadece bir kez)
                    }
                    if (data.type === 'chat') {
                        appendChatMessage(data.sender, data.text);
                        broadcastData(data, conn.peer);
                    }
                    if (data.type === 'cam-state') {
                        handleRemoteCamState(data.peerId, data.isCamOff);
                        broadcastData(data, conn.peer);
                    }
                });

                conn.on('close', () => {
                    hostDataConnections = hostDataConnections.filter(c => c.peer !== conn.peer);
                    roomClients = roomClients.filter(c => c.id !== conn.peer);
                });
            });
        }

        function broadcastData(data, excludePeerId = null) {
            hostDataConnections.forEach(conn => {
                if (conn.peer !== excludePeerId) {
                    conn.send(data);
                }
            });
        }

        // --- VİDEO / SES ÇAĞRILARI ---
        function listenForCalls() {
            myPeer.on('call', (call) => {
                call.answer(myStream);
                const callerNick = call.metadata ? call.metadata.nick : "Danışan";
                handleStream(call, callerNick);
                startSessionTimer(); // Host için biri aradığında sayacı başlat
            });
        }

        function makeCall(peerId, targetNick) {
            const call = myPeer.call(peerId, myStream, { metadata: { nick: myNick } });
            handleStream(call, targetNick);
        }

        function handleStream(call, remoteNick) {
            if (peers[call.peer]) return;
            peers[call.peer] = call;

            call.on('stream', (remoteStream) => {
                if (document.getElementById(`video-${call.peer}`)) return;
                addVideoBox(call.peer, remoteNick, remoteStream, false);
            });

            call.peerConnection.oniceconnectionstatechange = function() {
                if(call.peerConnection.iceConnectionState == 'disconnected' ||
                   call.peerConnection.iceConnectionState == 'failed' ||
                   call.peerConnection.iceConnectionState == 'closed') {
                    removeVideoBox(call.peer);
                    delete peers[call.peer];
                    if(isHost) systemMessage(`${remoteNick} görüşmeden ayrıldı.`);
                }
            };

            call.on('close', () => {
                removeVideoBox(call.peer);
                delete peers[call.peer];
            });
        }

        // --- ARAYÜZ YÖNETİMİ ---
        function setupUI() {
            loginScreen.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                loginScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');
            }, 500);

            document.getElementById('display-nick').innerText = myNick;
            document.getElementById('display-room').innerText = document.getElementById('room-input').value;
            
            // Kendi videomuzu ekleyelim
            addVideoBox('self', myNick, myStream, true);
            addUserToList('self', myNick, true);

            // Saat ve Timer başlat
            startLiveClock();
        }

        function addVideoBox(id, nick, stream, isLocal) {
            emptyState.classList.add('hidden');
            
            const container = document.createElement('div');
            container.id = `box-${id}`;
            // 2 kişiye kadar grid tam yer kaplasın, fazlası için küçülsün
            container.className = "video-container w-full max-w-2xl"; 
            
            const video = document.createElement('video');
            video.id = `video-${id}`;
            video.srcObject = stream;
            video.autoplay = true;
            video.playsInline = true;
            if (isLocal) {
                video.muted = true; // Kendi sesimizi yankı yapmaması için kısıyoruz
            }

            // Kamera Kapalı İkonu/Overlay
            const camOffOverlay = document.createElement('div');
            camOffOverlay.id = `overlay-${id}`;
            camOffOverlay.className = "cam-off-overlay hidden";
            camOffOverlay.innerHTML = `<i class="fa-solid fa-user-slash mb-2 text-slate-400"></i><span class="text-sm text-slate-500 font-medium">Kamera Kapalı</span>`;

            // İsim Etiketi
            const label = document.createElement('div');
            label.className = "user-label";
            label.innerHTML = `
                ${isLocal ? '<i class="fa-solid fa-user text-[10px]"></i>' : ''}
                ${nick} ${isLocal ? '(Siz)' : ''}
                <i id="mic-status-${id}" class="fa-solid fa-microphone text-[10px] ml-1"></i>
            `;

            container.appendChild(video);
            container.appendChild(camOffOverlay);
            container.appendChild(label);
            videoGridUI.appendChild(container);

            if (!isLocal) {
                addUserToList(id, nick, false);
            }
        }

        function removeVideoBox(id) {
            document.getElementById(`box-${id}`)?.remove();
            document.getElementById(`li-${id}`)?.remove();
            if(videoGridUI.querySelectorAll('.video-container').length === 1) { // Sadece kendim kaldım
                emptyState.classList.remove('hidden');
            }
        }

        function addUserToList(id, nick, isMe) {
            if (document.getElementById(`li-${id}`)) return;
            const li = document.createElement('li');
            li.id = `li-${id}`;
            li.className = "flex items-center justify-between p-2 rounded-lg bg-slate-50 border border-slate-100";
            li.innerHTML = `
                <span class="text-sm font-medium text-slate-700 truncate pr-2">${nick} ${isMe ? '<span class="text-xs text-slate-400 font-normal">(Siz)</span>' : ''}</span>
                <div class="status-dot"></div>
            `;
            userListUI.appendChild(li);
        }

        // --- KONTROL BUTONLARI (Kamera, Mikrofon, Dipses) ---
        
        // Mikrofon
        muteBtn.onclick = () => {
            isMuted = !isMuted;
            myStream.getAudioTracks()[0].enabled = !isMuted;
            const icon = document.getElementById('mute-icon');
            const statusIcon = document.getElementById('mic-status-self');
            
            if(isMuted) {
                muteBtn.classList.add('active-off');
                icon.classList.replace('fa-microphone', 'fa-microphone-slash');
                if(statusIcon) statusIcon.classList.replace('fa-microphone', 'fa-microphone-slash');
                if(statusIcon) statusIcon.style.color = '#ef4444';
            } else {
                muteBtn.classList.remove('active-off');
                icon.classList.replace('fa-microphone-slash', 'fa-microphone');
                if(statusIcon) statusIcon.classList.replace('fa-microphone-slash', 'fa-microphone');
                if(statusIcon) statusIcon.style.color = 'white';
            }
        };

        // Kamera
        camBtn.onclick = () => {
            isCamOff = !isCamOff;
            myStream.getVideoTracks()[0].enabled = !isCamOff;
            const icon = document.getElementById('cam-icon');
            const overlay = document.getElementById('overlay-self');
            
            if(isCamOff) {
                camBtn.classList.add('active-off');
                icon.classList.replace('fa-video', 'fa-video-slash');
                if(overlay) overlay.classList.remove('hidden');
            } else {
                camBtn.classList.remove('active-off');
                icon.classList.replace('fa-video-slash', 'fa-video');
                if(overlay) overlay.classList.add('hidden');
            }

            // Diğer kişilere kameramın durumunu bildir
            const msgData = { type: 'cam-state', peerId: myPeer.id, isCamOff: isCamOff };
            if (isHost) broadcastData(msgData);
            else if (myHostDataConnection && myHostDataConnection.open) myHostDataConnection.send(msgData);
        };

        // Diğer kişinin kamera durumunu arayüzde güncelleme
        function handleRemoteCamState(peerId, remoteCamOff) {
            const overlay = document.getElementById(`overlay-${peerId}`);
            if (overlay) {
                if (remoteCamOff) overlay.classList.remove('hidden');
                else overlay.classList.add('hidden');
            }
        }

        // Dipses (Gürültü Engelleme)
        noiseBtn.onclick = async () => {
            isNoiseSuppression = !isNoiseSuppression;
            const audioTrack = myStream.getAudioTracks()[0];
            const icon = document.getElementById('noise-icon');
            
            if (audioTrack) {
                try {
                    await audioTrack.applyConstraints({
                        noiseSuppression: isNoiseSuppression,
                        echoCancellation: true
                    });
                    
                    if(isNoiseSuppression) {
                        noiseBtn.classList.add('active-blue');
                        systemMessage("Dipses (Gürültü Engelleme) aktif edildi.");
                    } else {
                        noiseBtn.classList.remove('active-blue');
                        systemMessage("Dipses (Gürültü Engelleme) kapatıldı. Ham ses iletiliyor.");
                    }
                } catch (e) {
                    console.error("Constraint uygulanamadı:", e);
                    systemMessage("Uyarı: Tarayıcınız anlık dipses kontrolünü desteklemiyor olabilir.");
                    // Geri al
                    isNoiseSuppression = !isNoiseSuppression;
                }
            }
        };

        // --- YAZILI SOHBET ---
        function sendChatMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            const msgData = { type: 'chat', sender: myNick, text: text };
            appendChatMessage('Siz', text, true);

            if (isHost) {
                broadcastData(msgData); 
            } else {
                if (myHostDataConnection && myHostDataConnection.open) {
                    myHostDataConnection.send(msgData); 
                }
            }

            chatInput.value = '';
            chatInput.focus();
        }

        function systemMessage(text) {
            const div = document.createElement('div');
            div.className = "text-center text-xs text-slate-400 my-1 italic";
            div.innerText = text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendChatMessage(sender, text, isMe = false) {
            const div = document.createElement('div');
            div.className = "flex flex-col w-full animate-fade-in";
            
            if (isMe) {
                div.innerHTML = `
                    <div class="self-end max-w-[85%]">
                        <div class="bg-[#648270] text-white px-4 py-2.5 rounded-2xl rounded-tr-sm text-sm shadow-sm break-words">
                            ${text}
                        </div>
                    </div>`;
            } else {
                div.innerHTML = `
                    <div class="self-start max-w-[85%]">
                        <span class="block text-[11px] text-slate-400 ml-1 mb-1 font-medium">${sender}</span>
                        <div class="bg-slate-100 text-slate-700 px-4 py-2.5 rounded-2xl rounded-tl-sm text-sm shadow-sm break-words">
                            ${text}
                        </div>
                    </div>`;
            }

            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatSendBtn.addEventListener('click', sendChatMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });

        // --- LİNK PAYLAŞIMI ---
        shareBtn.onclick = () => {
            const rawRoom = document.getElementById('room-input').value.trim();
            const baseUrl = window.location.origin + window.location.pathname;
            const inviteLink = `${baseUrl}?room=${encodeURIComponent(rawRoom)}`;
            
            const tempInput = document.createElement('input');
            tempInput.value = inviteLink;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);

            const icon = document.getElementById('share-icon');
            icon.className = 'fa-solid fa-check text-green-600';
            systemMessage("Görüşme linki panoya kopyalandı. Danışanınıza iletebilirsiniz.");
            
            setTimeout(() => {
                icon.className = 'fa-solid fa-link';
            }, 3000);
        };

        // --- ZAMANLAYICILAR (SAAT VE SÜRE) ---
        function startLiveClock() {
            setInterval(() => {
                const now = new Date();
                const timeStr = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
                document.getElementById('current-time').innerText = timeStr;
            }, 1000);
        }

        function startSessionTimer() {
            if (sessionStartTime) return; // Zaten başladıysa tekrar başlatma
            sessionStartTime = Date.now();
            
            sessionTimerInterval = setInterval(() => {
                const elapsed = Date.now() - sessionStartTime;
                const totalSeconds = Math.floor(elapsed / 1000);
                
                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;
                
                const timeStr = 
                    (hours > 0 ? String(hours).padStart(2, '0') + ':' : '') +
                    String(minutes).padStart(2, '0') + ':' +
                    String(seconds).padStart(2, '0');
                    
                document.getElementById('session-timer').innerText = timeStr;
            }, 1000);
        }

    </script>
</body>
</html>
